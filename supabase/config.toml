# A string used to distinguish different Supabase projects on the same host
project_id = "master-touch"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# CLI v2: apply files in supabase/migrations during db reset / start
[db.migrations]
enabled = true

# CLI v2: seed after migrations on `supabase db reset` (and first `supabase start`)
# Use a single entrypoint — do NOT also list ./seed/*.sql here (would duplicate data).
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/reset-password", "http://localhost:3000/admin"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"
